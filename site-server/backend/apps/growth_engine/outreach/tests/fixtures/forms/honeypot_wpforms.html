<header><nav><a href="/">خانه</a> <a href="/products">محصولات</a> <a href="/about">درباره ما</a> <a href="/login">ورود / ثبت‌نام</a></nav></header>
<main>
<h1>تماس با ما</h1>
<form action="/contact" method="post" class="wpforms-form">
  <div class="wpforms-field"><label>Name</label><input type="text" name="wpforms[fields][0]" required></div>
  <div class="wpforms-field"><label>Email</label><input type="email" name="wpforms[fields][1]" required></div>
  <div class="wpforms-field"><label>Comment or Message</label><textarea name="wpforms[fields][2]" required></textarea></div>
  <div class="wpforms-field wpforms-field-hp"><label>Phone</label><input type="text" name="wpforms[hp]" class="wpforms-field-medium"></div>
  <button type="submit" name="wpforms[submit]" value="wpforms-submit">Submit</button>
</form>
</main>
<footer><p>© ۱۴۰۵ فروشگاه گل‌سرخ · تهران، خیابان ولیعصر</p></footer>
