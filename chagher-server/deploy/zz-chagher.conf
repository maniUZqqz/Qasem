# ---------------------------------------------------------------- panel.chagher.ir
server {
    listen 80;
    server_name panel.chagher.ir;
    set_real_ip_from 185.239.3.189;
    real_ip_header X-Real-IP;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type "text/plain"; allow all; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name panel.chagher.ir;
    ssl_certificate /etc/letsencrypt/live/panel.chagher.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.chagher.ir/privkey.pem;
    set_real_ip_from 185.239.3.189;
    real_ip_header X-Real-IP;
    client_max_body_size 25m;
    proxy_read_timeout 330s;
    proxy_send_timeout 330s;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml;
    location /chagher/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /panel/      { proxy_pass http://127.0.0.1:8001; include /www/server/nginx/conf/chagher-proxy.conf; }
    location /api/        { proxy_pass http://127.0.0.1:8001; include /www/server/nginx/conf/chagher-proxy.conf; }
    location /exercise/   { proxy_pass http://127.0.0.1:8001; include /www/server/nginx/conf/chagher-proxy.conf; }
    location /exercises/  { proxy_pass http://127.0.0.1:8001; include /www/server/nginx/conf/chagher-proxy.conf; }
    location /form-check/ { proxy_pass http://127.0.0.1:8001; include /www/server/nginx/conf/chagher-proxy.conf; }
    location /static/ { alias /www/wwwroot/Cheghar/backend/gym/static/; expires 30d; access_log off; }
    location /media/  { alias /www/wwwroot/Cheghar/backend/gym/media/;  expires 30d; access_log off; }
    location / {
        root /www/wwwroot/Cheghar/frontend/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
