<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>تماس با ما | فروشگاه گل‌سرخ</title>

</head>
<body>
<header><nav><a href="/">خانه</a> <a href="/products">محصولات</a> <a href="/about">درباره ما</a> <a href="/login">ورود / ثبت‌نام</a></nav></header>
<main>
<h1>تماس با ما</h1>
<form action="/contact" method="post" class="contact">
  <input type="hidden" name="form_id" value="42">
  <label for="n">نام</label><input id="n" name="name" type="text" required>
  <label for="e">ایمیل</label><input id="e" name="email" type="email" required>
  <label for="c">شهر</label><input id="c" name="city" type="text">
  <label for="k">از کجا با ما آشنا شدید؟</label><input id="k" name="source" type="text" value="گوگل">
  <label for="d">بخش</label>
  <select id="d" name="dept"><option value="general">عمومی</option><option value="sales">فروش</option></select>
  <label><input type="checkbox" name="newsletter" value="yes" checked> دریافت خبرنامه</label>
  <label><input type="checkbox" name="callback" value="yes"> تماس تلفنی بگیرید</label>
  <label for="m">پیام</label><textarea id="m" name="message" required></textarea>
  <button type="submit" name="action" value="send">ارسال</button>
</form>
</main>
<footer><p>© ۱۴۰۵ فروشگاه گل‌سرخ · تهران، خیابان ولیعصر</p></footer>
</body>
</html>
