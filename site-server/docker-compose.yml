# UpMarket — production stack.
#
#   docker compose up -d --build
#
# Everything the product needs except the GPU services. Ollama and ComfyUI stay
# on the machine that has the card: they are reached over the network through
# OLLAMA_BASE_URL / COMFYUI_BASE_URL, or replaced entirely by setting
# AI_API_BASE_URL. That split is why this stack can run on a cheap VPS while
# rendering happens somewhere with a GPU.
#
# Copy .env.production.example to .env before the first run.

name: upmarket

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-upmarket}
      POSTGRES_USER: ${POSTGRES_USER:-upmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD لازم است}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Backups are written here by the backup service and are readable from
      # the host, so restoring never depends on the container being alive.
      - ./backups:/backups
    healthcheck:
      # Other services wait for this, so it has to mean "ready for queries",
      # not merely "process started".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-upmarket} -d ${POSTGRES_DB:-upmarket}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly keeps the queue across a restart. Without it a container
    # bounce silently drops every queued render job.
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-upmarket}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-upmarket}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    expose: ["8000"]

  # Migrations run once, in their own container, before the app serves traffic.
  # Running them from an entrypoint means every replica races to migrate the
  # same database.
  migrate:
    build:
      context: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-upmarket}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-upmarket}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_plans"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  # Two workers on purpose. A 40-minute video render on the shared queue would
  # block every caption and analysis behind it; the gpu queue is serialised
  # because there is one card, the ai queue is not.
  worker-ai:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-upmarket}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-upmarket}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A config worker -l info -Q celery,ai --concurrency=2 -n ai@%h
    volumes:
      - media:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker-gpu:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-upmarket}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-upmarket}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    # One at a time: there is one GPU, and two renders sharing it are slower
    # than the same two in sequence.
    command: celery -A config worker -l info -Q gpu --concurrency=1 -n gpu@%h
    volumes:
      - media:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  website:
    build:
      context: ./website
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://127.0.0.1:8000}
      NEXT_PUBLIC_PANEL_URL: ${PUBLIC_PANEL_URL:-http://127.0.0.1:5173}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://nmarketing.ir}
    expose: ["3001"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on: [backend, website]

  # Nightly dump, kept for a fortnight. Plain pg_dump rather than anything
  # clever, because a backup you cannot restore by hand at 3am is not a backup.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  db-data:
  redis-data:
  media:
  static:
