# Chagher (chagher.ir, www, app/my, panel) — moved from 185.239.3.189 on 1405/07/28.
# Same behaviour as the old server's /etc/nginx/sites-available/{chagher.ir,app.chagher.ir,panel.chagher.ir}, adapted to this
# shared server (ARKA = tamouz.studio, UpMarket = :8040 live here too):
#   - file name starts with "zz-" so tamouz.studio stays the default 443 server
#   - "http2 on;" per server block (not on listen) so ARKA's 443 is not changed; no IPv6 listens (this server has none)
#   - no IP / :8000 blocks (port 8000 belongs to ARKA here)
#   - acme-challenge on every :80 block (certbot renews with webroot /var/www/html)
#   - real client IP when the old server proxies to us during the DNS switch

map $http_x_forwarded_proto $chagher_need_https {
    default  1;
    https    0;
}

# ---------------------------------------------------------------- chagher.ir / www
server {
    listen 80;
    server_name chagher.ir www.chagher.ir;
    set_real_ip_from 185.239.3.189;
    real_ip_header X-Real-IP;
    access_log /www/wwwlogs/chagher.ir.access.log;
    error_log  /www/wwwlogs/chagher.ir.error.log;
    location = /healthz { add_header Content-Type text/plain; return 200 'ok-direct'; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type "text/plain"; allow all; }
    location / {
        if ($chagher_need_https) {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 330s;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name chagher.ir www.chagher.ir;
    ssl_certificate /etc/letsencrypt/live/chagher.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chagher.ir/privkey.pem;
    set_real_ip_from 185.239.3.189;
    real_ip_header X-Real-IP;
    access_log /www/wwwlogs/chagher.ir.access.log;
    error_log  /www/wwwlogs/chagher.ir.error.log;
    client_max_body_size 25m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/x-javascript application/xml application/wasm
               image/svg+xml font/ttf font/otf font/woff font/woff2;
    location /chagher/ { rewrite ^/chagher/(.*)$ /$1 permanent; }
    location = /chagher { return 301 /; }
    location /chagherpanel/ {
        rewrite ^/chagherpanel/(.*)$ /$1 break;
        root /www/wwwroot/Cheghar/frontend/web;
        try_files $uri $uri/ /index.html;
    }
    location ~* ^/chagherpanel/(canvaskit|assets)/ {
        rewrite ^/chagherpanel/(.*)$ /$1 break;
        root /www/wwwroot/Cheghar/frontend/web;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location /static/ {
        alias /www/wwwroot/Cheghar/backend/gym/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }
    location /media/ {
        alias /www/wwwroot/Cheghar/backend/gym/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_buffering on;
    }
}

