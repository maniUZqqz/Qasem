# NMarketing (UpMarket) — یک مبدأ برای همه‌چیز روی پورت 8040
#   /            سایتِ عمومی (Next.js، 127.0.0.1:3001)
#   /panel/      پنلِ React (فایل‌های ساخته‌شده)
#   /api/ /admin/ /studio/ /3d/ /compute/   جنگو (gunicorn، 127.0.0.1:8041)
#   /static/ /media/ /3d/files/             فایل‌ها، مستقیم
# ARKA (پورت 80/443 و 8000) دست نخورده است.
server {
    listen 8040;
    server_name _;
    server_tokens off;
    client_max_body_size 200m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    access_log /www/wwwlogs/nm-8040.log;
    error_log  /www/wwwlogs/nm-8040.error.log;

    # ---- فایل‌های ایستا و رسانه
    location ^~ /static/ { alias /var/www/NM/upmarket/backend/staticfiles/; expires 7d; access_log off; }
    location ^~ /media/  { alias /var/www/NM/upmarket/backend/media/; expires 1d; }
    location ^~ /3d/files/ { alias /var/www/NM/upmarket/data/up3d/; expires 1d; }

    # ---- پنلِ React زیرِ /panel/
    location = /panel { return 301 /panel/; }
    location /panel/ {
        alias /var/www/NM/upmarket/frontend/dist/;
        try_files $uri $uri/ /panel/index.html;
        expires 1h;
    }
    location = /panel/index.html { alias /var/www/NM/upmarket/frontend/dist/index.html; add_header Cache-Control "no-store"; }

    # ---- پیشرفتِ زندهٔ کار (SSE): بی‌بافر
    location ~ ^/api/v1/jobs/[0-9]+/stream/$ {
        proxy_pass http://127.0.0.1:8041;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }

    # ---- جنگو
    location ~ ^/(api|admin|studio|3d|compute|healthz|readyz|metrics)(/|$) {
        proxy_pass http://127.0.0.1:8041;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # ---- سایتِ عمومی
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
