<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>تماس با ما | فروشگاه نمونه</title></head>
<body>
<header><nav><a href="/">خانه</a> <a href="/about">درباره ما</a></nav></header>
<main>
<h1>تماس با ما</h1>
<form action="/send-message" method="post" id="contact-form" class="contact-form">
  <input type="hidden" name="_token" value="{token}">
  <label for="n">نام و نام خانوادگی *</label>
  <input type="text" id="n" name="fullname" required>
  <label for="e">ایمیل *</label>
  <input type="email" id="e" name="email" required>
  <label for="p">شماره تماس</label>
  <input type="tel" id="p" name="mobile">
  <label for="s">موضوع</label>
  <input type="text" id="s" name="subject">
  <label for="m">پیام شما *</label>
  <textarea id="m" name="message" required></textarea>
  <label for="c">کد پیگیری</label><input type="text" id="c" name="tracking" value="">
  <button type="submit">ارسال پیام</button>
</form>
</main>
</body>
</html>
