# NMarketing — چرخشِ لاگ‌ها (نصب: deploy/nm/ops/install-ops.sh ⇒ /etc/logrotate.d/nm)
#
# روزانه، ۱۴ نسخه، فشرده؛ copytruncate چون سرویس‌ها فایلِ لاگ را باز نگه می‌دارند (بدونِ ری‌استارت و بدونِ از دست رفتنِ خط).
# gunicorn / celery / nginx همه در حالتِ append می‌نویسند، پس بریدنِ فایل امن است. «maxsize» یعنی اگر در یک روز از ۲۰۰ مگ گذشت زودتر بچرخد.
#
# فقط لاگ‌های NMarketing. لاگ‌های چغر و بقیهٔ سایت‌های nginx (chagher-ip.access.log، port_8000.log …) این‌جا نیستند و دست نمی‌خورند.
# logs/django-errors.log را خودِ RotatingFileHandler ِ جنگو می‌چرخاند (settings.LOGGING)، پس این‌جا نیست.
/var/www/NM/upmarket/logs/celery.log
/var/www/NM/upmarket/logs/celery-node.log
/var/www/NM/upmarket/logs/beat.log
/var/www/NM/upmarket/logs/web-access.log
/var/www/NM/upmarket/logs/web-error.log
/www/wwwlogs/nm-8040.log
/www/wwwlogs/nm-8040.error.log
/www/wwwlogs/nmdom-*.log
/var/log/nm-domain.log
{
    daily
    rotate 14
    maxsize 200M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    su root root
}
