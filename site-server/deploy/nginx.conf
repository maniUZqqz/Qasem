# UpMarket reverse proxy.
#
# One origin for everything, so the browser never meets a cross-origin
# request: the marketing site at /, the panel API under /api, and the files
# Django wrote under /media. That also means the session id the marketing site
# stores is readable by the panel without passing it through a URL.

upstream backend  { server backend:8000; }
upstream website  { server website:3001; }

# Uploads are capped in Django too (MAX_UPLOAD_MB); this is the outer guard so
# an oversized body is refused before it reaches Python.
client_max_body_size 25m;

server {
    listen 80;
    server_name _;

    # Hide the nginx version from an attacker enumerating targets.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Django API and admin -------------------------------------------
    # Live job progress (server-sent events). Needs its own block: the /api/
    # defaults below buffer the response and cut it at 120s, which would turn a
    # stream into one silent request that dies mid-render.
    location ~ ^/api/v1/jobs/[0-9]+/stream/$ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # Comfortably past the server's own 300s cap, so the backend is what
        # decides when a stream ends.
        proxy_read_timeout 360s;
    }

    # --- Monitoring (phase 18) -------------------------------------------
    # Liveness and readiness are open: a load balancer has no credentials. They
    # are kept out of the access log because they are asked every second and
    # would otherwise be 99% of it.
    location = /healthz {
        access_log off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # /metrics is NOT listed here. It is staff-only in Django, and it names
    # customers' jobs — if you expose it to a scraper, put the scraper on the
    # private network rather than opening a public path to it.

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The lead endpoint records this for abuse triage, so it has to be the
        # real client address rather than the proxy's.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A render request returns immediately, but the sync fallback does not.
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Files Django produced ------------------------------------------
    # Served straight off the volume; Python should never stream a video.
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
        # Anything uploaded is untrusted: never let the browser decide it is
        # HTML and run it on our origin.
        add_header X-Content-Type-Options nosniff always;
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Marketing site --------------------------------------------------
    location / {
        proxy_pass http://website;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
